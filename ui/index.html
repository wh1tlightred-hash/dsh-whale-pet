<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>鲸伴 · DeepSeek 桌宠</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="companion" data-status="idle">
    <section id="panel" class="panel" hidden aria-label="项目与审批">
      <div id="panel-content" class="panel-content">
        <div id="projects" class="project-list" role="list" aria-label="项目列表"></div>
        <section id="question-section" class="question" hidden aria-label="待回答的问题"><div class="approval-heading"><span class="approval-icon question-icon">?</span><div><h2>需要你的回答</h2><p id="question-count"></p></div></div><p id="question-project" class="approval-project"></p><div id="question-list" class="question-list"></div><p id="question-error" class="error-message" role="alert" hidden></p><div class="approval-actions"><button id="question-submit" class="button primary">提交回答</button></div></section>
        <section id="approval-section" class="approval" hidden aria-label="待审批操作">
          <div class="approval-heading"><span class="approval-icon">!</span><div><h2>这一步，需要你点头</h2><p id="approval-count"></p></div></div>
          <p id="approval-project" class="approval-project"></p>
          <dl><dt>申请原因</dt><dd id="approval-reason"></dd><dt id="operation-label">具体操作</dt><dd><pre id="approval-operation" tabindex="0"></pre></dd></dl>
          <p id="decision-error" class="error-message" role="alert" hidden></p>
          <div class="approval-actions"><button id="reject" class="button secondary">拒绝</button><button id="allow" class="button primary">批准一次 <span>↗</span></button></div>
          <p class="approval-footnote">仅针对当前操作，每次申请单独确认</p>
        </section>
      </div>
    </section>
    <section class="pet-stage" aria-label="鲸鱼娘桌宠">
      <aside id="notice" class="notice" hidden aria-live="polite"><button id="dismiss-notice" aria-label="关闭提醒">×</button><strong id="notice-title"></strong><p id="notice-body"></p></aside>
      <button id="summary" class="summary" aria-expanded="false" title="点击查看项目和审批"><span class="status-dot"></span><span class="summary-text"><strong id="current-project">蓝色大肥鱼</strong><span id="current-status">在这里陪你</span></span><span id="summary-chevron" class="chevron">⌃</span></button>
      <div id="character-wrap" class="character-wrap"><div class="water-ring"></div><img id="character" class="character" src="../assets/winter/idle.png" alt="冬装鲸鱼娘，根据任务状态显示不同动作" draggable="false"><span id="mood" class="mood" aria-hidden="true">✦</span><span class="spark spark-one" aria-hidden="true">✧</span><span class="spark spark-two" aria-hidden="true">·</span></div>

      <div id="pet-menu" class="pet-menu" role="menu" aria-label="桌宠菜单" hidden><button id="menu-top" type="button" role="menuitemcheckbox" aria-checked="true">置顶<span class="menu-check" aria-hidden="true">✓</span></button><button id="menu-hide" type="button" role="menuitem">隐藏桌宠</button></div>
      <span id="demo-label" class="demo-label" hidden>演示模式 · 未连接 dsh</span>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
